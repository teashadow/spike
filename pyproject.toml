[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spike"
version = "0.1.0"
description = "MAD prompt injection battery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
]

[project.scripts]
spike = "spike_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
